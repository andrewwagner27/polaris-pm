name: Stripe ACH safety checks

on:
  pull_request:
    paths:
      - 'tenant-portal/**'
      - '.github/workflows/stripe-ach-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tenant-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tenant-portal/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build tenant portal
        run: npm run build
